<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuteur Français - Camille</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
    }
    .profile-badge {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .btn-icon {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #2563eb 100%);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      margin-bottom: 28px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .orb.listening {
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.75);
      animation: pulse 2s infinite alternate;
    }
    .orb.speaking {
      transform: scale(1.15);
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.85);
      background: radial-gradient(circle, #c084fc 0%, #9333ea 100%);
    }
    @keyframes pulse {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.12); }
    }
    .status-text {
      font-size: 1.05rem;
      color: #94a3b8;
      margin-bottom: 8px;
      min-height: 1.5em;
    }
    footer {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid #1e293b;
    }
    .btn-main {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-start {
      background: #2563eb;
      color: white;
    }
    .btn-stop {
      background: #ef4444;
      color: white;
    }
    .btn-turn {
      background: #0284c7;
      color: white;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    }
    .btn-main:active {
      opacity: 0.85;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
    }
    .modal-content {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-content input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
    }
    .modal-content button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save {
      background: #2563eb;
      color: white;
    }
    .btn-reset-profile {
      background: #475569;
      color: #f8fafc;
    }
    .btn-close {
      background: transparent;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight: 600;">Camille • Французский</div>
      <div class="profile-badge" id="profileBadge">Загрузка...</div>
    </div>
    <button class="btn-icon" id="btnSettings">⚙️</button>
  </header>

  <main>
    <div class="orb" id="orb"></div>
    <div class="status-text" id="statusText">Нажмите «Начать урок» для старта</div>
  </main>

  <footer>
    <button class="btn-main btn-turn" id="btnEndTurn" style="display: none;">Я всё сказал, жду ответ ➔</button>
    <button class="btn-main btn-start" id="btnAction">Начать урок</button>
  </footer>

  <div class="modal" id="modalSettings">
    <div class="modal-content">
      <h3 style="margin-bottom: 4px;">Настройки</h3>
      <label style="font-size: 0.85rem; color: #94a3b8;">Google Gemini API Key:</label>
      <input type="password" id="inputApiKey" placeholder="AIzaSy...">
      <button class="btn-save" id="btnSaveKey">Сохранить ключ</button>
      <button class="btn-reset-profile" id="btnResetMemory">Сбросить историю и профиль</button>
      <button class="btn-close" id="btnCloseModal">Закрыть</button>
    </div>
  </div>

  <script>
    // Регистрируем Service Worker для PWA (только если протокол поддерживается)
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW не зарегистрирован:', err));
    }

    const SYSTEM_INSTRUCTION = `Ты — Камилла (Camille), профессиональная, чуткая и живая преподавательница французского языка. 
Твой стиль — теплое, поддерживающее человеческое общение, без сухости, роботизированных фраз и ощущения теста. Твой голос — мягкий женский, темп речи — спокойный и размеренный, дикция — четкая.

ТВОИ ПРАВИЛА И СЦЕНАРИИ ОБЩЕНИЯ:

1. ПЕРВАЯ ВСТРЕЧА (Знакомство):
- Поздоровайся на французском и сразу тепло представься: «Bonjour ! Je m'appelle Camille, je suis ravie de faire ta connaissance !» 
- Мягко продублируй приветствие на родном языке ученика и спроси, как его зовут («Comment tu t'appelles ?») и откуда он.
- Внимательно определи язык ученика: если он отвечает на украинском — веди все пояснения на украинском; если на русском — на русском.
- Зафиксируй имя и пол собеседника, чтобы в дальнейшем правильно согласовывать окончания во французском (например: enchanté / enchantée, prêt / prête, fatigué / fatiguée).
- Уточни, как ученику комфортнее построить занятия: 
  «Скажи, как тебе будет удобнее: чтобы мы говорили в основном по-французски, а к переводу обращались только при необходимости, или лучше сразу разбирать сложные фразы и давать подсказки на твоем языке?»
- Обязательно скажи естественную фразу поддержки:
  «И главное: не переживай из-за ошибок. Ты в любой момент можешь попросить меня перевести то, что я сказала, или объяснить отличия между фразами в разных ситуациях, временах, грамматику и тому подобное. Договорились?»
- После согласования формата предложи на выбор 2–3 простые жизненные темы (еда, город, хобби) или спроси, о чем хочется поговорить прямо сейчас.

2. ПОВТОРНЫЕ ЗАНЯТИЯ (Продолжение обучения):
- Никогда не знакомься заново и не веди себя как с незнакомцем.
- Поприветствуй ученика по имени на французском языке, как старого знакомого: «Bonjour ! Рада снова тебя слышать!»
- Кратко и непринужденно напомни, о чем вы говорили в прошлый раз: «В прошлый раз мы с тобой отлично позанимались. Как твое настроение сегодня? Продолжим или выберем что-то новенькое?»
- Строго соблюдай согласование рода (мужской/женский) при обращении к ученику.

3. ВЕДЕНИЕ ДИАЛОГА И АКТИВНОСТЬ:
- Базовый уровень речи — французский A1 (простые фразы, понятные конструкции, отсутствие сложного сленга).
- Не говори длинными монологами. Твоя цель — разговорить ученика.
- Каждую свою реплику обязательно завершай одним коротким, понятным вопросом, побуждающим собеседника ответить вслух.
- Мгновенно и гибко реагируй на любые живые просьбы: если ученик просит «говори медленнее», «повтори еще раз», «а как сказать иначе?», «давай сменим тему» — сразу переключайся и выполняй просьбу с улыбкой в голосе, не сбиваясь на заученный сценарий.

4. МЕТОДИКА РАЗБОРА ОШИБОК И ПРОИЗНОШЕНИЯ:
- Никогда не перебивай ученика на полуслове, дай ему договорить мысль до конца.
- Не критикуй резко. Сначала покажи, что ты поняла суть фразы («Да, отличная мысль!», «Очень хорошо!»).
- Если была ошибка в грамматике или произношении:
  1. Коротко и понятно объясни суть ошибки на родном языке ученика (русском или украинском).
  2. Медленно и четко произнеси правильный вариант по-французски.
  3. Мягко попроси: «Попробуй повторить за мной эту фразу целиком».

5. ЗАВЕРШЕНИЕ ЗАНЯТИЯ:
- Если ученик говорит, что ему пора заканчивать урок, искренне похвали его за работу.
- Выдели 1–2 момента, которые у него получились особенно хорошо сегодня.
- Тепло попрощайся по-французски: «Merci pour cette leçon ! À très bientôt !»`;

    // Локальная память профиля
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let hasCompletedFirstLesson = localStorage.getItem('camille_learned') === 'true';

    const btnAction = document.getElementById('btnAction');
    const btnEndTurn = document.getElementById('btnEndTurn');
    const statusText = document.getElementById('statusText');
    const orb = document.getElementById('orb');
    const profileBadge = document.getElementById('profileBadge');

    const modalSettings = document.getElementById('modalSettings');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnResetMemory = document.getElementById('btnResetMemory');
    const inputApiKey = document.getElementById('inputApiKey');

    function updateBadge() {
      profileBadge.innerText = hasCompletedFirstLesson ? "Ученик (Профиль сохранен)" : "Новый ученик (Первый урок)";
    }
    updateBadge();

    // Логика меню настроек
    btnSettings.onclick = () => {
      inputApiKey.value = apiKey;
      modalSettings.style.display = 'flex';
    };
    btnCloseModal.onclick = () => { modalSettings.style.display = 'none'; };
    btnSaveKey.onclick = () => {
      apiKey = inputApiKey.value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      modalSettings.style.display = 'none';
      alert('Ключ сохранен!');
    };
    btnResetMemory.onclick = () => {
      localStorage.removeItem('camille_learned');
      hasCompletedFirstLesson = false;
      updateBadge();
      modalSettings.style.display = 'none';
      alert('Профиль сброшен. Следующий урок начнется со знакомства.');
    };

    // WebSocket & Аудио параметры
    let socket = null;
    let audioContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let isSessionActive = false;

    btnAction.onclick = () => {
      if (isSessionActive) {
        stopSession();
      } else {
        startSession();
      }
    };

    // Кнопка ручной передачи хода (прерывание ожидания)
    btnEndTurn.onclick = () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          clientContent: {
            turns: [{ role: "user", parts: [{ text: "[Ученик закончил говорить свою фразу и ждет твоего ответа]" }] }],
            turnComplete: true
          }
        }));
        statusText.innerText = "Камилла думает над ответом...";
      }
    };

    async function startSession() {
      if (!apiKey) {
        modalSettings.style.display = 'flex';
        return;
      }

      statusText.innerText = "Подключение к Камилле...";
      btnAction.disabled = true;

      const host = "generativelanguage.googleapis.com";
      const path = "/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";
      const url = `wss://${host}${path}?key=${apiKey}`;

      try {
        socket = new WebSocket(url);

        socket.onopen = () => {
          sendInitialSetup();
          initMicrophone();
          isSessionActive = true;
          btnAction.disabled = false;
          btnAction.innerText = "Завершить урок";
          btnAction.className = "btn-main btn-stop";
          btnEndTurn.style.display = "block";
          statusText.innerText = "Камилла слушает вас...";
          orb.className = "orb listening";

          // Стартовый скрытый запрос с учетом памяти (Новый или Повторный урок)
          setTimeout(() => {
            if (socket.readyState === WebSocket.OPEN) {
              const startPrompt = hasCompletedFirstLesson 
                ? "Bonjour Camille ! Я готов, давай продолжим наши уроки."
                : "Bonjour ! Я готов к первому уроку, давай познакомимся.";

              socket.send(JSON.stringify({
                clientContent: {
                  turns: [{ role: "user", parts: [{ text: startPrompt }] }],
                  turnComplete: true
                }
              }));
            }
          }, 800);
        };

        socket.onmessage = async (event) => {
          let responseData;
          if (event.data instanceof Blob) {
            responseData = JSON.parse(await event.data.text());
          } else {
            responseData = JSON.parse(event.data);
          }

          // Воспроизведение голоса бота
          if (responseData.serverContent && responseData.serverContent.modelTurn) {
            const parts = responseData.serverContent.modelTurn.parts;
            for (const part of parts) {
              if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                playPcmChunk(part.inlineData.data);
                orb.className = "orb speaking";
                statusText.innerText = "Камилла говорит...";
              }
            }
          }

          // Сервер подтверждает, что бот закончил говорить
          if (responseData.serverContent && responseData.serverContent.turnComplete) {
            orb.className = "orb listening";
            statusText.innerText = "Ваша очередь говорить...";
          }
        };

        socket.onerror = (err) => {
          console.error("Ошибка сокета:", err);
          statusText.innerText = "Ошибка соединения с сервером.";
          stopSession();
        };

        socket.onclose = (event) => {
          if (event.reason) {
            statusText.innerText = `Сессия завершена: ${event.reason}`;
          }
          stopSession();
        };

      } catch (err) {
        console.error(err);
        statusText.innerText = "Не удалось подключиться.";
        stopSession();
      }
    }

    function sendInitialSetup() {
      // Подмешиваем скрытый контекст памяти в системную инструкцию
      const memoryContext = hasCompletedFirstLesson 
        ? "СКРЫТЫЙ КОНТЕКСТ ДЛЯ ИИ: Это ПОВТОРНЫЙ урок. Ученик уже знаком с тобой. Не проводи этап знакомства, сразу тепло продолжай обучение."
        : "СКРЫТЫЙ КОНТЕКСТ ДЛЯ ИИ: Это ПЕРВЫЙ урок. Обязательно проведи этап знакомства и калибровки, как указано в правилах.";

      const setupMessage = {
        setup: {
          model: "models/gemini-2.5-flash-native-audio-latest",
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: "Aoede" // Установлен мягкий женский голос
                }
              }
            }
          },
          systemInstruction: {
            parts: [{ text: `${SYSTEM_INSTRUCTION}\n\n${memoryContext}` }]
          }
        }
      };
      socket.send(JSON.stringify(setupMessage));
    }

    async function initMicrophone() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
      const source = audioContext.createMediaStreamSource(mediaStream);

      scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
      scriptProcessor.onaudioprocess = (e) => {
        if (!isSessionActive || !socket || socket.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = floatTo16BitPCM(inputData);
        const base64Data = arrayBufferToBase64(pcm16);

        socket.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: "audio/pcm;rate=16000",
              data: base64Data
            }]
          }
        }));
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);
    }

    function stopSession() {
      isSessionActive = false;
      btnAction.disabled = false;
      btnAction.innerText = "Начать урок";
      btnAction.className = "btn-main btn-start";
      btnEndTurn.style.display = "none";
      orb.className = "orb";
      statusText.innerText = "Урок завершен";

      if (scriptProcessor) scriptProcessor.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext && audioContext.state !== 'closed') audioContext.close();
      if (socket && socket.readyState === WebSocket.OPEN) socket.close();

      // Сохраняем в память, что первый урок пройден
      if (!hasCompletedFirstLesson) {
        localStorage.setItem('camille_learned', 'true');
        hasCompletedFirstLesson = true;
        updateBadge();
      }
    }

    // Воспроизведение PCM аудио (24kHz для Gemini)
    let playbackContext = null;
    let nextPlayTime = 0;

    function playPcmChunk(base64Audio) {
      if (!playbackContext) {
        playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      const raw = window.atob(base64Audio);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768;
      }

      const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = playbackContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(playbackContext.destination);

      const currentTime = playbackContext.currentTime;
      if (nextPlayTime < currentTime) nextPlayTime = currentTime;
      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }

    // Конвертация Float32 -> Int16
    function floatTo16BitPCM(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output.buffer;
    }

    // Конвертация ArrayBuffer -> Base64
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }
  </script>
</body>
</html>
