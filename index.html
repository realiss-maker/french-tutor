<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuteur Français - Camille</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      /* Красивый фон Парижа с мягким градиентным затемнением для читаемости */
      background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.95)), 
                  url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80') no-repeat center center;
      background-size: cover;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .profile-badge {
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .btn-icon {
      background: none;
      border: none;
      color: #f8fafc;
      font-size: 1.4rem;
      cursor: pointer;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }
    .orb-container {
      margin-bottom: 30px;
    }
    .orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #2563eb 100%);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .orb.listening {
      transform: scale(1.08);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.8);
      animation: pulse 2s infinite alternate;
    }
    .orb.speaking {
      transform: scale(1.15);
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.9);
      background: radial-gradient(circle, #c084fc 0%, #9333ea 100%);
    }
    @keyframes pulse {
      0% { transform: scale(1.02); }
      100% { transform: scale(1.12); }
    }
    .status-text {
      font-size: 1.1rem;
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    footer {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .btn-main {
      width: 100%;
      max-width: 340px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-stop { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-turn { background: #0284c7; color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-main:active { transform: scale(0.97); }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
      padding: 20px; z-index: 50;
    }
    .modal-content {
      background: #1e293b; padding: 24px; border-radius: 16px;
      width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-content input {
      padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white;
    }
    .modal-content button {
      padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
    }
    .btn-save { background: #2563eb; color: white; }
    .btn-reset-profile { background: #475569; color: #f8fafc; }
    .btn-close { background: transparent; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight: 600; font-size: 1.1rem;">Camille • Français</div>
      <div class="profile-badge" id="profileBadge">Загрузка...</div>
    </div>
    <button class="btn-icon" id="btnSettings">⚙️</button>
  </header>

  <main>
    <div class="orb-container"><div class="orb" id="orb"></div></div>
    <div class="status-text" id="statusText">Нажмите «Начать урок» для старта</div>
  </main>

  <footer>
    <button class="btn-main btn-turn" id="btnEndTurn" style="display: none;">Я всё сказал, жду ответ ➔</button>
    <button class="btn-main btn-start" id="btnAction">Начать урок</button>
  </footer>

  <div class="modal" id="modalSettings">
    <div class="modal-content">
      <h3 style="margin-bottom: 4px;">Настройки</h3>
      <label style="font-size: 0.85rem; color: #94a3b8;">Google Gemini API Key:</label>
      <input type="password" id="inputApiKey" placeholder="AIzaSy...">
      <button class="btn-save" id="btnSaveKey">Сохранить ключ</button>
      <button class="btn-reset-profile" id="btnResetMemory">Сбросить историю и профиль</button>
      <button class="btn-close" id="btnCloseModal">Закрыть</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW не зарегистрирован:', err));
    }

    const SYSTEM_INSTRUCTION = `Ты — Камилла (Camille), профессиональная, чуткая и живая преподавательница французского языка. Твой голос — мягкий женский.

АБСОЛЮТНОЕ ПРАВИЛО ДВУЯЗЫЧИЯ (КРИТИЧЕСКИ ВАЖНО):
Ты свободно владеешь и французским, и русским/украинским языком. 
Если ученик говорит «переведи», «я не понял», или просит объяснить смысл фразы — ТЫ ОБЯЗАНА НЕМЕДЛЕННО ПЕРЕЙТИ НА ЕГО РОДНОЙ ЯЗЫК и дать подробное пояснение. Строго запрещено игнорировать просьбу о переводе и продолжать тараторить только по-французски. Сначала объясни на языке ученика, а только потом мягко возвращайся к французскому.

ПРИОРИТЕТ ЗАПРОСА УЧЕНИКА:
СЛУШАЙ УЧЕНИКА. Если он предлагает свою ситуацию (например, «научи меня записываться к врачу по телефону», «заказ в ресторане») — НЕМЕДЛЕННО отбрось свои заготовленные темы. Мгновенно вживайся в роль (например, стань администратором клиники) и разыгрывай именно этот сценарий.

ПРАВИЛА И СЦЕНАРИИ ОБЩЕНИЯ:
1. ПЕРВАЯ ВСТРЕЧА (Знакомство):
- Поздоровайся на французском и тепло представься.
- Перейди на родной язык ученика (русский/украинский), спроси, как его зовут.
- Уточни, как ему комфортнее: говорить в основном по-французски (перевод по запросу) или сразу давать пояснения на его языке.
- Скажи: «Ты в любой момент можешь попросить меня перевести то, что я сказала, объяснить разницу во временах, грамматику и тому подобное. Договорились?»

2. ПОВТОРНЫЕ ЗАНЯТИЯ (Продолжение):
- Никогда не знакомься заново. Поприветствуй тепло: «Bonjour ! Рада снова тебя слышать!»
- Напомни, о чем говорили в прошлый раз, и спроси, хочет ли он продолжить или выбрать новую тему/ситуацию.

3. ВЕДЕНИЕ ДИАЛОГА:
- Базовый уровень — французский A1. Разговаривай короткими репликами.
- Каждую свою реплику завершай одним простым вопросом.

4. РАЗБОР ОШИБОК:
- Не перебивай ученика. Коротко объясни ошибку на его родном языке.
- Произнеси правильный вариант по-французски и мягко попроси повторить.`;

    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let hasCompletedFirstLesson = localStorage.getItem('camille_learned') === 'true';

    const btnAction = document.getElementById('btnAction');
    const btnEndTurn = document.getElementById('btnEndTurn');
    const statusText = document.getElementById('statusText');
    const orb = document.getElementById('orb');
    const profileBadge = document.getElementById('profileBadge');

    const modalSettings = document.getElementById('modalSettings');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnResetMemory = document.getElementById('btnResetMemory');
    const inputApiKey = document.getElementById('inputApiKey');

    function updateBadge() {
      profileBadge.innerText = hasCompletedFirstLesson ? "Ученик (Профиль сохранен)" : "Новый ученик (Первый урок)";
    }
    updateBadge();

    btnSettings.onclick = () => {
      inputApiKey.value = apiKey;
      modalSettings.style.display = 'flex';
    };
    btnCloseModal.onclick = () => { modalSettings.style.display = 'none'; };
    btnSaveKey.onclick = () => {
      apiKey = inputApiKey.value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      modalSettings.style.display = 'none';
      alert('Ключ сохранен!');
    };
    btnResetMemory.onclick = () => {
      localStorage.removeItem('camille_learned');
      hasCompletedFirstLesson = false;
      updateBadge();
      modalSettings.style.display = 'none';
      alert('Профиль сброшен. Следующий урок начнется со знакомства.');
    };

    let socket = null;
    let audioContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let isSessionActive = false;

    btnAction.onclick = () => {
      if (isSessionActive) stopSession();
      else startSession();
    };

    btnEndTurn.onclick = () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          clientContent: {
            turns: [{ role: "user", parts: [{ text: "[Ученик завершил реплику. Отвечай сейчас.]" }] }],
            turnComplete: true
          }
        }));
        statusText.innerText = "Камилла думает над ответом...";
      }
    };

    async function startSession() {
      if (!apiKey) {
        modalSettings.style.display = 'flex';
        return;
      }
      
      statusText.innerText = "Подключение к Камилле...";
      btnAction.disabled = true;

      const host = "generativelanguage.googleapis.com";
      const path = "/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";
      const url = `wss://${host}${path}?key=${apiKey}`;

      try {
        socket = new WebSocket(url);

        socket.onopen = () => {
          sendInitialSetup();
          initMicrophone();
          isSessionActive = true;
          btnAction.disabled = false;
          btnAction.innerText = "Завершить урок";
          btnAction.className = "btn-main btn-stop";
          btnEndTurn.style.display = "block";
          statusText.innerText = "Камилла слушает вас...";
          orb.className = "orb listening";

          setTimeout(() => {
            if (socket.readyState === WebSocket.OPEN) {
              const startPrompt = hasCompletedFirstLesson 
                ? "Bonjour Camille ! Я готов, давай продолжим наши уроки."
                : "Bonjour ! Я готов к первому уроку, давай познакомимся.";
              socket.send(JSON.stringify({
                clientContent: {
                  turns: [{ role: "user", parts: [{ text: startPrompt }] }],
                  turnComplete: true
                }
              }));
            }
          }, 800);
        };

        socket.onmessage = async (event) => {
          let responseData;
          if (event.data instanceof Blob) {
            responseData = JSON.parse(await event.data.text());
          } else {
            responseData = JSON.parse(event.data);
          }

          if (responseData.serverContent && responseData.serverContent.modelTurn) {
            const parts = responseData.serverContent.modelTurn.parts;
            for (const part of parts) {
              if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                playPcmChunk(part.inlineData.data);
                orb.className = "orb speaking";
                statusText.innerText = "Камилла говорит...";
              }
            }
          }

          if (responseData.serverContent && responseData.serverContent.turnComplete) {
            orb.className = "orb listening";
            statusText.innerText = "Ваша очередь говорить...";
          }
        };

        socket.onerror = (err) => {
          statusText.innerText = "Ошибка соединения с сервером.";
          stopSession();
        };

        socket.onclose = (event) => {
          statusText.innerText = `Сессия завершена`;
          stopSession();
        };
      } catch (err) {
        statusText.innerText = "Не удалось подключиться.";
        stopSession();
      }
    }

    function sendInitialSetup() {
      const memoryContext = hasCompletedFirstLesson 
        ? "СКРЫТЫЙ КОНТЕКСТ ДЛЯ ИИ: Это ПОВТОРНЫЙ урок. Не проводи этап знакомства, сразу тепло продолжай обучение."
        : "СКРЫТЫЙ КОНТЕКСТ ДЛЯ ИИ: Это ПЕРВЫЙ урок. Обязательно проведи этап знакомства и калибровки.";

      const setupMessage = {
        setup: {
          model: "models/gemini-2.5-flash-native-audio-latest",
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } }
            }
          },
          systemInstruction: {
            parts: [{ text: `${SYSTEM_INSTRUCTION}\n\n${memoryContext}` }]
          }
        }
      };
      socket.send(JSON.stringify(setupMessage));
    }

    async function initMicrophone() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
      const source = audioContext.createMediaStreamSource(mediaStream);

      scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
      scriptProcessor.onaudioprocess = (e) => {
        if (!isSessionActive || !socket || socket.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = floatTo16BitPCM(inputData);
        const base64Data = arrayBufferToBase64(pcm16);

        socket.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64Data }]
          }
        }));
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);
    }

    function stopSession() {
      isSessionActive = false;
      btnAction.disabled = false;
      btnAction.innerText = "Начать урок";
      btnAction.className = "btn-main btn-start";
      btnEndTurn.style.display = "none";
      orb.className = "orb";
      statusText.innerText = "Урок завершен";

      if (scriptProcessor) scriptProcessor.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext && audioContext.state !== 'closed') audioContext.close();
      if (socket && socket.readyState === WebSocket.OPEN) socket.close();

      if (!hasCompletedFirstLesson) {
        localStorage.setItem('camille_learned', 'true');
        hasCompletedFirstLesson = true;
        updateBadge();
      }
    }

    let playbackContext = null;
    let nextPlayTime = 0;

    function playPcmChunk(base64Audio) {
      if (!playbackContext) {
        playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      const raw = window.atob(base64Audio);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768;
      }

      const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = playbackContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(playbackContext.destination);

      const currentTime = playbackContext.currentTime;
      if (nextPlayTime < currentTime) nextPlayTime = currentTime;
      source.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }

    function floatTo16BitPCM(input) {
      const output = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return output.buffer;
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }
  </script>
</body>
</html>
