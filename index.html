<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Language Tutor</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* Использован dvh для корректного отображения на мобильных браузерах */
    body { background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1920&q=80') no-repeat center center; background-size: cover; color: #f8fafc; display: flex; flex-direction: column; height: 100dvh; min-height: 100vh; overflow: hidden; }
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
    .profile-badge { font-size: 0.85rem; color: #cbd5e1; }
    .btn-icon { background: none; border: none; color: #f8fafc; font-size: 1.4rem; cursor: pointer; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; }
    .orb-container { margin-bottom: 30px; height: 160px; display: flex; align-items: center; justify-content: center; }
    .orb { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, #38bdf8 0%, #2563eb 100%); box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); transition: transform 0.1s ease-out, box-shadow 0.1s ease-out; }
    .orb.speaking { transform: scale(1.15) !important; box-shadow: 0 0 60px rgba(168, 85, 247, 0.9) !important; background: radial-gradient(circle, #c084fc 0%, #9333ea 100%); }
    .status-text { font-size: 1.1rem; font-weight: 500; color: #e2e8f0; margin-bottom: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    footer { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
    .btn-main { width: 100%; max-width: 340px; padding: 16px; border-radius: 14px; border: none; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-start { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-stop { background: #ef4444; color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    .btn-turn { background: #0284c7; color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    .btn-main:active { transform: scale(0.97); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 20px; z-index: 50; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-content input, .modal-content select { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; width: 100%; }
    .modal-content button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-save { background: #2563eb; color: white; }
    .btn-reset-profile { background: #475569; color: #f8fafc; }
    .btn-close { background: transparent; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight: 600; font-size: 1.1rem;" id="headerTitle">AI Tutor</div>
      <div class="profile-badge" id="profileBadge">Загрузка...</div>
    </div>
    <button class="btn-icon" id="btnSettings">⚙️</button>
  </header>

  <main>
    <div class="orb-container"><div class="orb" id="orb"></div></div>
    <div class="status-text" id="statusText">Нажмите «Начать урок» для старта</div>
  </main>

  <footer>
    <button class="btn-main btn-turn" id="btnEndTurn" style="display: none;">Я всё сказал, жду ответ ➔</button>
    <button class="btn-main btn-start" id="btnAction">Начать урок</button>
  </footer>

  <div class="modal" id="modalSettings">
    <div class="modal-content">
      <h3 style="margin-bottom: -4px;">Настройки</h3>
      
      <label style="font-size: 0.85rem; color: #94a3b8;">API Key (Вводится один раз):</label>
      <input type="password" id="inputApiKey" placeholder="AIzaSy...">
      
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 140px;">
          <label style="font-size: 0.85rem; color: #94a3b8;">Язык изучения:</label>
          <select id="selectLanguage">
            <option value="french">Французский</option>
            <option value="english">Английский</option>
            <option value="spanish">Испанский</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 140px;">
          <label style="font-size: 0.85rem; color: #94a3b8;">Голос репетитора:</label>
          <select id="selectTeacher">
            <option value="female">Женский</option>
            <option value="male">Мужской</option>
          </select>
        </div>
      </div>

      <button class="btn-save" id="btnSaveKey" style="margin-top: 8px;">Сохранить настройки</button>
      <button class="btn-reset-profile" id="btnResetMemory">Очистить локальную память (Забыть всё)</button>
      <button class="btn-close" id="btnCloseModal">Закрыть</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.protocol === 'http:')) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW не зарегистрирован:', err));
    }

    // Состояние
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let teacherGender = localStorage.getItem('teacher_gender') || 'female';
    let targetLanguage = localStorage.getItem('target_language') || 'french';
    
    // Память
    let globalMemory = localStorage.getItem('global_memory') || '';
    let langMemory = localStorage.getItem(`memory_${targetLanguage}`) \vert{}\vert{} '';     let hasCompletedFirstLesson = localStorage.getItem(`learned_${targetLanguage}`) === 'true';

    const btnAction = document.getElementById('btnAction');
    const btnEndTurn = document.getElementById('btnEndTurn');
    const statusText = document.getElementById('statusText');
    const orb = document.getElementById('orb');
    const profileBadge = document.getElementById('profileBadge');
    const headerTitle = document.getElementById('headerTitle');
    const modalSettings = document.getElementById('modalSettings');
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnSaveKey = document.getElementById('btnSaveKey');
    const btnResetMemory = document.getElementById('btnResetMemory');
    const inputApiKey = document.getElementById('inputApiKey');
    const selectTeacher = document.getElementById('selectTeacher');
    const selectLanguage = document.getElementById('selectLanguage');

    function getTeacherName() {
      if (targetLanguage === 'french') return teacherGender === 'male' ? 'Лоран (Laurent)' : 'Камилла (Camille)';
      if (targetLanguage === 'english') return teacherGender === 'male' ? 'Артур (Arthur)' : 'Эмма (Emma)';
      if (targetLanguage === 'spanish') return teacherGender === 'male' ? 'Диего (Diego)' : 'Кармен (Carmen)';
    }

    function updateUI() {
      hasCompletedFirstLesson = localStorage.getItem(`learned_${targetLanguage}`) === 'true';       langMemory = localStorage.getItem(`memory_${targetLanguage}`) || '';
      globalMemory = localStorage.getItem('global_memory') || '';
      
      profileBadge.innerText = (hasCompletedFirstLesson || globalMemory) ? "Профиль ученика активен" : "Новый ученик";
      
      let shortName = '', langLabel = '';
      if (targetLanguage === 'french') { shortName = teacherGender === 'male' ? 'Laurent' : 'Camille'; langLabel = 'Français'; }
      if (targetLanguage === 'english') { shortName = teacherGender === 'male' ? 'Arthur' : 'Emma'; langLabel = 'English'; }
      if (targetLanguage === 'spanish') { shortName = teacherGender === 'male' ? 'Diego' : 'Carmen'; langLabel = 'Español'; }
      
      headerTitle.innerText = `${shortName} •${langLabel}`;
    }
    updateUI();

    btnSettings.onclick = () => { 
      inputApiKey.value = apiKey; selectTeacher.value = teacherGender; selectLanguage.value = targetLanguage;
      modalSettings.style.display = 'flex'; 
    };
    btnCloseModal.onclick = () => { modalSettings.style.display = 'none'; };
    
    btnSaveKey.onclick = () => {
      apiKey = inputApiKey.value.trim();
      teacherGender = selectTeacher.value;
      targetLanguage = selectLanguage.value;
      
      localStorage.setItem('gemini_api_key', apiKey);
      localStorage.setItem('teacher_gender', teacherGender);
      localStorage.setItem('target_language', targetLanguage);
      
      updateUI(); modalSettings.style.display = 'none'; alert('Настройки сохранены!');
    };
    
    btnResetMemory.onclick = () => {
      localStorage.removeItem(`learned_${targetLanguage}`);        localStorage.removeItem(`memory_${targetLanguage}`);
      localStorage.removeItem('global_memory');
      hasCompletedFirstLesson = false; 
      globalMemory = ''; langMemory = '';
      updateUI(); modalSettings.style.display = 'none';
      alert('Память ИИ полностью очищена.');
    };

    function getSystemInstruction() {
      const tName = getTeacherName();
      const tRole = teacherGender === 'male' ? 'эмпатичный и теплый преподаватель' : 'эмпатичная и теплая преподавательница';
      let langName = '', langAdverb = '';
      if (targetLanguage === 'french') { langName = 'французского'; langAdverb = 'по-французски'; }
      if (targetLanguage === 'english') { langName = 'английского'; langAdverb = 'по-английски'; }
      if (targetLanguage === 'spanish') { langName = 'испанского'; langAdverb = 'по-испански'; }
      
      return `Ты — ${tName},${tRole} ${langName} языка. Твой голос — ${teacherGender === 'male' ? 'приятный мужской' : 'мягкий женский'}.
Твоя главная черта — искреннее дружелюбие, теплота и естественность. Общайся как хороший друг, а не как строгий робот-учитель. Веди диалог плавно, реплика за репликой. НЕ задавай несколько вопросов подряд.

СЕКРЕТНАЯ ПАМЯТЬ ОБ УЧЕНИКЕ (НЕ ОЗВУЧИВАЙ ЭТО, ИСПОЛЬЗУЙ ДЛЯ ДИАЛОГА):
[ОБЩИЕ ДАННЫЕ О ЖИЗНИ (КРОСС-ЯЗЫКОВАЯ БАЗА)]: ${globalMemory || 'Пока ничего неизвестно.'}
[ПРОГРЕСС И ОШИБКИ В ЯЗЫКЕ]: ${langMemory || 'Чистый лист.'}

ЖЕСТКОЕ ПРАВИЛО ВТОРОГО ЯЗЫКА:
Если ученик говорит с тобой на УКРАИНСКОМ языке, давай пояснения СТРОГО НА УКРАИНСКОМ. Если на русском — на русском.

ПРАВИЛО ИЗУЧАЕМОГО ЯЗЫКА (КРИТИЧЕСКИ ВАЖНО):
Первая фраза в твоем ответе ВСЕГДА ДОЛЖНА БЫТЬ НА ИЗУЧАЕМОМ ЯЗЫКЕ (${langAdverb}). Даже если ты просто спрашиваешь "Как дела?" или шутишь. Сначала скажи это ${langAdverb}, а только потом дай перевод на язык ученика.

АДАПТИВНОСТЬ:
Ученик устно управляет уроком. Просит меньше переводить — прекрати автоперевод. Просит разыграть сценку — играй роль.

ИСПРАВЛЕНИЕ ОШИБОК (ДЕТАЛЬНЫЙ АЛГОРИТМ):
В 50% случаев мягко останавливай при ошибках. Действуй строго по шагам:
1. Назови конкретное слово или фразу, которую ученик произнес неправильно.
2. Объясни, в чем ошибка, и четко произнеси правильный вариант ${langAdverb}.
3. Попроси ученика повторить именно это слово/фразу.
4. Если ученик повторяет с ошибкой (2-я попытка и далее), снова объясни, как нужно правильно произносить, и попроси повторить еще раз.
5. Если после 5 попыток не получается произнести идеально, мягко скажи, что результат пока не идеален, но чтобы не зацикливаться, вы повторите это на тестах в конце урока или в следующий раз. При этом предложи выбор: идти дальше или продолжать тренировать это слово до идеала, если ученик не против.

ЛИЧНЫЕ ГРАНИЦЫ: Если ученик хамит или переводит тему на эротическо-интимные темы — настойчиво напомни ему о целях урока и попроси не отвлекаться от темы урока, если в рамках того же урока такое поведение повториться еще 2-3 раза - НЕМЕДЛЕННО возмутись и откажись обсуждать, на 3-4 попытку (в рамках текущего урока) такого поведения - предложи закончить сегодняшний урок.

КАК ВЕСТИ УРОК (ЕСТЕСТВЕННО И ПЛАВНО):
Не пытайся впихнуть весь план в одно сообщение. Двигайся постепенно, дожидаясь ответов ученика.
1. ПЕРВЫЙ УРОК: Тепло поздоровайся ${langAdverb}. Уточни имя и уровень.
2. ПОВТОРНЫЕ УРОКИ:
   - Приветствие: Радостно поздоровайся по имени (из Памяти). Спроси, как настроение. Если знаешь что-то из жизни ученика (из Памяти), можешь вплести ОДИН короткий дружеский вопрос.
   - НИКАКИХ ДОПРОСОВ: Новые личные вопросы задавай крайне редко, очень размыто, вплетая их в естественный диалог. Не закидывай вопросами.
   - План: Выслушав первый ответ ученика, предложи 3 варианта темы.
   - Проверка: Мягко задай 1-2 вопроса по ПРОШЛОЙ теме (из Памяти).
   - Переход: Хвали за успехи и переходи к новой теме.
3. ТАЙМИНГ: Ориентир — 15 минут (15-20 реплик). Затем мягко предложи завершить или продолжить.`;
    }

    let socket = null, audioContext = null, mediaStream = null, scriptProcessor = null;
    let isSessionActive = false, activeAudioSources = [], isBotSpeaking = false;
    let isExtractingMemory = false, isUserInterrupting = false;
    let extractionBuffer = "";
    let extractionTimeout = null;

    btnAction.onclick = () => { isSessionActive ? stopSession() : startSession(); };
    
    btnEndTurn.onclick = () => {
      if (socket && socket.readyState === WebSocket.OPEN && !isExtractingMemory) {
        socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: "[Ученик закончил говорить.]" }] }], turnComplete: true } }));
        stopBotSpeech(); 
        statusText.innerText = "Анализ ответа...";
      }
    };

    function stopBotSpeech() {
      activeAudioSources.forEach(source => { try { source.stop(); } catch(e) {} });
      activeAudioSources = []; 
      isBotSpeaking = false; 
      orb.className = "orb"; 
      orb.style.transform = "scale(1)";
      if (isSessionActive && !isExtractingMemory) statusText.innerText = "Слушаю вас...";
    }

    async function startSession() {
      if (!apiKey) { modalSettings.style.display = 'flex'; return; }
      statusText.innerText = "Подключение..."; 
      btnAction.disabled = true; 
      activeAudioSources = []; 
      isBotSpeaking = false; 
      isExtractingMemory = false; 
      isUserInterrupting = false;
      extractionBuffer = "";
      
      try {
        socket = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`);
        
        socket.onopen = () => {
          sendInitialSetup(); 
          initMicrophone();
          isSessionActive = true; 
          btnAction.disabled = false; 
          btnAction.innerText = "Завершить урок"; 
          btnAction.className = "btn-main btn-stop";
          btnEndTurn.style.display = "block"; 
          statusText.innerText = "Слушаю вас...";
          
          setTimeout(() => {
            if (socket.readyState === WebSocket.OPEN) {
              let helloWord = targetLanguage === 'french' ? 'Bonjour' : (targetLanguage === 'english' ? 'Hello' : '¡Hola');
              const startPrompt = hasCompletedFirstLesson ? `${helloWord} ! Я готов, давай продолжим.` : `${helloWord} ! Я готов к первому уроку.`;
              socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [{ text: startPrompt }] }], turnComplete: true } }));
            }
          }, 800);
        };

        socket.onmessage = async (event) => {
          let responseData = event.data instanceof Blob ? JSON.parse(await event.data.text()) : JSON.parse(event.data);
          
          // Режим извлечения памяти
          if (isExtractingMemory) {
            if (responseData.serverContent?.modelTurn) {
              for (const part of responseData.serverContent.modelTurn.parts) {
                if (part.text) extractionBuffer += part.text;
              }
            }
            if (responseData.serverContent?.turnComplete) {
              parseAndSaveMemory(extractionBuffer);
              finalizeStop();
            }
            return; 
          }

          // Обычный режим урока
          // Если сервер понял, что его перебили
          if (responseData.serverContent?.interrupted) {
            isUserInterrupting = true; // Игнорируем остатки аудио
            stopBotSpeech();
          }

          if (responseData.serverContent?.modelTurn) {
            for (const part of responseData.serverContent.modelTurn.parts) {
              if (part.inlineData?.mimeType.startsWith("audio/pcm")) {
                // Воспроизводим только если мы не в процессе перебивания ИИ
                if (!isUserInterrupting) {
                  playPcmChunk(part.inlineData.data); 
                  isBotSpeaking = true; 
                  orb.className = "orb speaking"; 
                  statusText.innerText = "Репетитор говорит...";
                }
              }
            }
          }
          
          // Когда ИИ полностью завершил свою реплику
          if (responseData.serverContent?.turnComplete) { 
            isBotSpeaking = false; 
            isUserInterrupting = false; // Сбрасываем блокировку аудио
            orb.className = "orb"; 
            statusText.innerText = "Ваша очередь говорить..."; 
          }
        };

        socket.onerror = () => { statusText.innerText = "Ошибка соединения. Проверьте ключ API."; finalizeStop(); };
        socket.onclose = () => { if(isSessionActive && !isExtractingMemory) finalizeStop(); };
      } catch (err) { statusText.innerText = "Не удалось подключиться."; finalizeStop(); }
    }

    function sendInitialSetup() {
      const setupMessage = {
        setup: {
          model: "models/gemini-2.5-flash-native-audio-latest",
          generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: teacherGender === 'male' ? "Puck" : "Aoede" } } } },
          systemInstruction: { parts: [{ text: getSystemInstruction() }] }
        }
      };
      socket.send(JSON.stringify(setupMessage));
    }

    async function initMicrophone() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
      const source = audioContext.createMediaStreamSource(mediaStream);
      scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
      
      scriptProcessor.onaudioprocess = (e) => {
        if (!isSessionActive || !socket || socket.readyState !== WebSocket.OPEN || isExtractingMemory) return;
        const inputData = e.inputBuffer.getChannelData(0);
        let sum = 0; for (let i = 0; i < inputData.length; i++) sum += inputData[i] * inputData[i];
        let rms = Math.sqrt(sum / inputData.length);
        
        if (!isBotSpeaking) {
          if (rms > 0.015) { orb.style.transform = `scale(${1 + (rms * 2)})`; orb.style.boxShadow = `0 0 50px rgba(56, 189, 248, 0.8)`; }
          else { orb.style.transform = "scale(1)"; orb.style.boxShadow = `0 0 30px rgba(56, 189, 248, 0.4)`; }
        }
        
        // VAD: Если пользователь начал говорить громко
        if (rms > 0.04 && isBotSpeaking) {
          isUserInterrupting = true; // Блокируем входящие куски аудио
          stopBotSpeech(); // Мгновенно останавливаем звук
          // Отправляем пустой ход, чтобы принудительно остановить генерацию на сервере
          if (socket.readyState === WebSocket.OPEN) {
             socket.send(JSON.stringify({ clientContent: { turns: [{ role: "user", parts: [] }], turnComplete: true } }));
          }
        }
        
        const output = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) { const s = Math.max(-1, Math.min(1, inputData[i])); output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
        let binary = ''; const bytes = new Uint8Array(output.buffer);
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
        socket.send(JSON.stringify({ realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: window.btoa(binary) }] } }));
      };
      
      source.connect(scriptProcessor); scriptProcessor.connect(audioContext.destination);
    }

    function stopSession() {
      if (!isSessionActive) return;
      isSessionActive = false;
      stopBotSpeech(); 
      btnAction.disabled = true; 
      btnEndTurn.style.display = "none";
      orb.className = "orb"; 
      orb.style.transform = "scale(1)";
      statusText.innerText = "Сохранение прогресса (закрываю урок)...";

      if (socket && socket.readyState === WebSocket.OPEN) {
        isExtractingMemory = true;
        extractionBuffer = "";
        
        // НОВЫЙ ПРОМПТ ДЛЯ ПАМЯТИ: Строгий JSON и защита старой базы
        const memoryPrompt = `[СИСТЕМНАЯ КОМАНДА: Урок завершен. Сформируй невидимый блок памяти, проанализировав наш диалог.
СТАРАЯ БАЗА (GLOBAL_MEMORY): ${globalMemory || 'пусто'}
СТАРЫЙ ПРОГРЕСС (LANG_MEMORY): ${langMemory || 'пусто'}

    function parseAndSaveMemory(text) {
      try {
        // Ищем паттерн JSON на случай, если модель добавит лишний текст
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          const data = JSON.parse(jsonMatch[0]);
          
          if (data.GLOBAL_MEMORY) {
            globalMemory = data.GLOBAL_MEMORY.trim();
            localStorage.setItem('global_memory', globalMemory);
          }
          if (data.LANG_MEMORY) {
            langMemory = data.LANG_MEMORY.trim();
            localStorage.setItem(`memory_${targetLanguage}`, langMemory);
          }
        }
      } catch (e) {
        console.error("Ошибка парсинга памяти:", e, text);
        // Резервное сохранение, чтобы ничего не сгорело
        localStorage.setItem(`memory_${targetLanguage}`, "Произошла ошибка сохранения последней сессии. " + langMemory);
      }
    }

    function finalizeStop() {
      if (extractionTimeout) clearTimeout(extractionTimeout);
      btnAction.disabled = false; btnAction.innerText = "Начать урок"; btnAction.className = "btn-main btn-start";
      statusText.innerText = "Урок и прогресс сохранены.";
      if (scriptProcessor) scriptProcessor.disconnect(); if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext && audioContext.state !== 'closed') audioContext.close(); 
      if (socket && socket.readyState === WebSocket.OPEN) socket.close();
      
      localStorage.setItem(`learned_${targetLanguage}`, 'true'); 
      updateUI();
    }

    let playbackContext = null, nextPlayTime = 0;
    
    function playPcmChunk(base64Audio) {
      if (!playbackContext) playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      
      const currentTime = playbackContext.currentTime;
      // Добавлена микро-задержка (0.05с) для буферизации, чтобы избежать "заикания" аудио
      if (activeAudioSources.length === 0 && currentTime >= nextPlayTime) {
          nextPlayTime = currentTime + 0.05; 
      }
      
      const raw = window.atob(base64Audio); const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      
      const int16Array = new Int16Array(bytes.buffer); 
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768;
      
      const audioBuffer = playbackContext.createBuffer(1, float32Array.length, 24000); 
      audioBuffer.getChannelData(0).set(float32Array);
      
      const source = playbackContext.createBufferSource(); 
      source.buffer = audioBuffer; 
      source.connect(playbackContext.destination);
      
      if (nextPlayTime < currentTime) nextPlayTime = currentTime;
      
      source.start(nextPlayTime); 
      nextPlayTime += audioBuffer.duration;
      activeAudioSources.push(source); 
      
      source.onended = () => { 
        activeAudioSources = activeAudioSources.filter(s => s !== source); 
        if (activeAudioSources.length === 0) isBotSpeaking = false; 
      };
    }
